<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DKC DİL</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            /* Beyaz arka plan ile boşlukları doldurma */
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 1000px;
            max-height: 800px;
            /* Arka plan görseli */
            background-image: url('arkaplan.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #ffffff; /* Beyaz dolgu */
            position: relative;
            overflow: hidden;
            border: 4px solid #2c3e50;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
        }

        #ui-panel {
            position: absolute;
            top: 2.5%;
            left: 3.5%;
            right: 3.5%;
            display: flex;
            justify-content: space-between;
            font-size: min(4vw, 30px);
            font-weight: bold;
            color: #2c3e50;
            z-index: 10;
            pointer-events: none;
            text-shadow: 1px 1px 4px rgba(255,255,255,0.8);
        }

        /* Nesne boyutları büyütüldü (90px -> 110px) */
        .falling-object {
            position: absolute;
            width: min(11vw, 110px);
            height: min(11vw, 110px);
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            animation: objectRotate 4s linear infinite;
            touch-action: manipulation;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .bonus-ball {
            background-image: url('50.png');
            animation: objectRotate 2s linear infinite;
        }

        .icon-en {
            background-image: url('english.png');
        }
        
        .icon-flag {
            background-image: url('flag.png');
        }

        .icon-osym {
            background-image: url('osym.png');
            width: min(13vw, 130px);
            height: min(13vw, 130px);
        }

        .icon-usa {
            background-image: url('united-states.png');
        }

        .clicked-feel {
            animation: clickShake 0.15s ease-in-out !important;
        }

        @keyframes objectRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes clickShake {
            0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            25% { transform: translate(-50%, -50%) scale(0.9) rotate(-5deg); }
            50% { transform: translate(-50%, -50%) scale(1.1) rotate(5deg); }
            75% { transform: translate(-50%, -50%) scale(0.95) rotate(-3deg); }
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
        }

        h1 { font-size: min(6vw, 54px); margin: 20px 0; text-shadow: 3px 3px 6px rgba(0,0,0,0.6); }
        p { font-size: min(3.5vw, 24px); margin: 10px 0 40px 0; text-align: center; padding: 0 10px; }
        button {
            padding: 1.5vh 4vw; font-size: min(3.5vw, 26px); font-weight: bold; color: white;
            background-color: #2ecc71; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4); transition: transform 0.1s, background-color 0.2s;
        }
        button:active { transform: scale(0.95); }
        button:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-panel">
            <div>Puan: <span id="score">0</span></div>
            <div>Can: <span id="lives">3</span></div>
        </div>

        <div id="start-screen">
            <h1 style="color: #3498db;">DKC DİL</h1>
            <p>Boyutlar büyütüldü - Nesneleri yakala!</p>
            <button onclick="startGame()">OYUNU BAŞLAT</button>
        </div>

        <div id="game-over-screen" style="display: none;">
            <h1 style="color: #e74c3c;">OYUN BİTTİ!</h1>
            <p>Toplam Puanınız: <span id="final-score">0</span></p>
            <button onclick="startGame()">Yeniden Başla</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');

        let score = 0;
        let lives = 3;
        let gameObjects = [];
        let gameInterval;
        let spawnInterval;
        let isPlaying = false;
        let gameSpeed = 5.0; // Ortalama başlangıç hızı
        let spawnRate = 600; 

        function startGame() {
            clearInterval(gameInterval);
            clearInterval(spawnInterval);

            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            document.querySelectorAll('.falling-object').forEach(obj => obj.remove());
            
            gameObjects = [];
            score = 0;
            lives = 3;
            gameSpeed = 5.0; 
            scoreDisplay.textContent = score;
            livesDisplay.textContent = lives;
            isPlaying = true;

            gameInterval = setInterval(updateGame, 15);
            spawnInterval = setInterval(createObject, spawnRate);
        }

        function createObject() {
            if (!isPlaying) return;

            createSingleObject();
            if (Math.random() < 0.3) {
                createSingleObject(); 
            }
        }

        function createSingleObject() {
            const obj = document.createElement('div');
            obj.classList.add('falling-object');

            // 50 puanlık bonus topuna %22.5 şans verme kontrolü
            const isBonus = Math.random() < 0.225;

            if (isBonus) {
                obj.classList.add('bonus-ball');
                obj.dataset.points = '50';
            } else {
                // Sözlük ve bayraklardan rastgele seç
                const otherIcons = ['icon-en', 'icon-flag', 'icon-osym', 'icon-usa'];
                const randomIcon = otherIcons[Math.floor(Math.random() * otherIcons.length)];
                obj.classList.add(randomIcon);
                obj.dataset.points = '10';
            }

            const containerWidth = gameContainer.clientWidth;
            const randomX = Math.random() * (containerWidth - 160) + 80;
            
            obj.style.left = `${randomX}px`;
            obj.style.top = '-120px';
            obj.y = -120;

            obj.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                handleObjectClick(obj);
            });

            gameContainer.appendChild(obj);
            gameObjects.push(obj);
        }

        function handleObjectClick(obj) {
            if (!isPlaying) return;

            obj.classList.add('clicked-feel');

            const pointsToAdd = parseInt(obj.dataset.points);
            score += pointsToAdd;
            scoreDisplay.textContent = score;

            // Puan arttıkça daha da hızlandır
            if (score > 0 && score % 100 === 0) {
                gameSpeed += 0.8; 
            }

            setTimeout(() => {
                obj.style.animation = 'none'; 
                obj.style.transition = 'transform 0.1s, opacity 0.1s';
                obj.style.transform = 'translate(-50%, -50%) scale(1.6)';
                obj.style.opacity = '0';

                setTimeout(() => {
                    obj.remove();
                }, 100);

                const index = gameObjects.indexOf(obj);
                if (index > -1) {
                    gameObjects.splice(index, 1);
                }
            }, 150);
        }

        function updateGame() {
            if (!isPlaying) return;

            const containerHeight = gameContainer.clientHeight;

            for (let i = gameObjects.length - 1; i >= 0; i--) {
                const obj = gameObjects[i];
                obj.y += gameSpeed;
                obj.style.top = `${obj.y}px`;

                if (obj.y > containerHeight + 100) {
                    obj.remove();
                    gameObjects.splice(i, 1);
                    lives--;
                    livesDisplay.textContent = lives;

                    if (lives <= 0) {
                        endGame();
                    }
                }
            }
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);

            document.querySelectorAll('.falling-object').forEach(obj => obj.remove());
            gameObjects = [];

            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
