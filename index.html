<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DKC DİL</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 1000px;
            max-height: 800px;
            background-image: url('arkaplan.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            border: 4px solid #2c3e50;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
        }

        #ui-panel {
            position: absolute;
            top: 2.5%;
            left: 3.5%;
            right: 3.5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: min(4vw, 30px);
            font-weight: bold;
            color: #2c3e50;
            z-index: 10;
            pointer-events: none;
            text-shadow: 1px 1px 4px rgba(255,255,255,0.8);
        }

        .lives-container {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }

        .heart-icon {
            width: 35px;
            height: 35px;
            background-image: url('heart.png');
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* Düşen Kelime Kutusu */
        .falling-word-object {
            position: absolute;
            width: auto;
            height: auto;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            font-weight: bold;
            font-size: min(2.5vw, 24px);
            /* Yazıların dönmemesi için transform sıfırlandı */
            transform: translate(-50%, -50%); 
        }

        /* Pozitif Kelime Stili (Yeşil Tonları) */
        .positive-word {
            background-color: #2ecc71;
            color: white;
            border: 2px solid #27ae60;
            /* Siyah yazıya beyaz kontür efekti */
            text-shadow: 
                -1px -1px 0 #000,  
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000;
        }

        /* Negatif Kelime Stili (Kırmızı Tonları) */
        .negative-word {
            background-color: #e74c3c;
            color: white;
            border: 2px solid #c0392b;
            text-shadow: 
                -1px -1px 0 #000,  
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000;
        }

        .clicked-feel {
            animation: clickShake 0.15s ease-in-out !important;
        }

        @keyframes clickShake {
            0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            25% { transform: translate(-50%, -50%) scale(0.9) rotate(-5deg); }
            50% { transform: translate(-50%, -50%) scale(1.1) rotate(5deg); }
            75% { transform: translate(-50%, -50%) scale(0.95) rotate(-3deg); }
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
        }

        h1 { font-size: min(6vw, 54px); margin: 20px 0; text-shadow: 3px 3px 6px rgba(0,0,0,0.6); }
        p { font-size: min(3.5vw, 22px); margin: 10px 0 40px 0; text-align: center; padding: 0 10px; }
        
        button {
            padding: 1.5vh 4vw; font-size: min(3.5vw, 26px); font-weight: bold; color: white;
            background-color: #2ecc71; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4); transition: transform 0.1s, background-color 0.2s;
        }
        button:active { transform: scale(0.95); }
        button:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-panel">
            <div>Puan: <span id="score">0</span></div>
            <div class="lives-container">
                Can: <span id="lives-count">3</span>
                <div class="heart-icon"></div>
            </div>
        </div>

        <div id="start-screen">
            <h1 style="color: #3498db;">DKC DİL</h1>
            <p>Yeşil kelimelere tıklayarak puan topla. Kırmızı kelimelere tıklama ve kaçırma!</p>
            <button onclick="startGame()">OYUNU BAŞLAT</button>
        </div>

        <div id="game-over-screen" style="display: none;">
            <h1 style="color: #e74c3c;">OYUN BİTTİ!</h1>
            <p>Toplam Puanınız: <span id="final-score">0</span></p>
            <button onclick="startGame()">Yeniden Başla</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const livesCountDisplay = document.getElementById('lives-count');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');

        let score = 0;
        let lives = 3;
        let gameObjects = [];
        let gameInterval;
        let spawnInterval;
        let isPlaying = false;
        let gameSpeed = 2.5; // Yavaşlatılmış oyun hızı
        let spawnRate = 900; 

        // Pozitif ve negatif kelime listeleri
        const positiveWords = [
            "Good", "Great", "Happy", "Yes", "Hello", "Friend", "Love", "Like", 
            "Beautiful", "Nice", "Thank you", "Please", "Welcome", "Family", 
            "Smile", "Fun", "New", "Sun", "Hope", "Peace"
        ];

        const negativeWords = [
            "Bad", "Sad", "No", "Hate", "Angry", "Cry", "Tired", "Sick", "Pain", 
            "Fear", "Sorry", "Lost", "Late", "Bad luck", "Wrong", "Ugly", "Cold", 
            "Boring", "Tired", "Difficult"
        ];

        function startGame() {
            clearInterval(gameInterval);
            clearInterval(spawnInterval);

            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            document.querySelectorAll('.falling-word-object').forEach(obj => obj.remove());
            
            gameObjects = [];
            score = 0;
            lives = 3;
            gameSpeed = 2.5; 
            scoreDisplay.textContent = score;
            livesCountDisplay.textContent = lives;
            isPlaying = true;

            gameInterval = setInterval(updateGame, 15);
            spawnInterval = setInterval(createWordObject, spawnRate);
        }

        function createWordObject() {
            if (!isPlaying) return;

            // %50 Pozitif, %50 Negatif kelime ihtimali
            const isPositive = Math.random() < 0.5;
            let wordText = "";
            let isPositiveWordType = false;

            if (isPositive) {
                wordText = positiveWords[Math.floor(Math.random() * positiveWords.length)];
                isPositiveWordType = true;
            } else {
                wordText = negativeWords[Math.floor(Math.random() * negativeWords.length)];
                isPositiveWordType = false;
            }

            const obj = document.createElement('div');
            obj.classList.add('falling-word-object');
            obj.textContent = wordText;

            if (isPositiveWordType) {
                obj.classList.add('positive-word');
                obj.dataset.type = 'positive';
                obj.dataset.points = '10';
            } else {
                obj.classList.add('negative-word');
                obj.dataset.type = 'negative';
                obj.dataset.points = '0'; // Negatif kelimeye tıklanırsa puan yok
            }

            const containerWidth = gameContainer.clientWidth;
            // Kelimelerin dışarı taşmaması için kenarlardan pay bırakılır
            const randomX = Math.random() * (containerWidth - 200) + 100;
            
            obj.style.left = `${randomX}px`;
            obj.style.top = '-80px';
            obj.y = -80;

            obj.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                handleWordClick(obj);
            });

            gameContainer.appendChild(obj);
            gameObjects.push(obj);
        }

        function handleWordClick(obj) {
            if (!isPlaying) return;

            obj.classList.add('clicked-feel');

            const type = obj.dataset.type;

            if (type === 'positive') {
                const pointsToAdd = parseInt(obj.dataset.points);
                score += pointsToAdd;
                scoreDisplay.textContent = score;
            } else {
                // Negatif kelimeye tıklanırsa can kaybı yaşanır
                lives--;
                livesCountDisplay.textContent = lives;
                if (lives <= 0) {
                    endGame();
                    return;
                }
            }

            // Yok etme animasyonu
            setTimeout(() => {
                obj.style.transition = 'transform 0.1s, opacity 0.1s';
                obj.style.transform = 'translate(-50%, -50%) scale(1.6)';
                obj.style.opacity = '0';

                setTimeout(() => {
                    obj.remove();
                }, 100);

                const index = gameObjects.indexOf(obj);
                if (index > -1) {
                    gameObjects.splice(index, 1);
                }

                if (score > 0 && score % 100 === 0) {
                    gameSpeed += 0.5;
                }
            }, 100);
        }

        function updateGame() {
            if (!isPlaying) return;

            const containerHeight = gameContainer.clientHeight;

            for (let i = gameObjects.length - 1; i >= 0; i--) {
                const obj = gameObjects[i];
                obj.y += gameSpeed;
                obj.style.top = `${obj.y}px`;

                // Ekrandan kaçan nesneler kontrolü
                if (obj.y > containerHeight + 60) {
                    const type = obj.dataset.type;
                    
                    if (type === 'positive') {
                        // Olumlu kelime kaçırılırsa can azalır
                        lives--;
                        livesCountDisplay.textContent = lives;
                    } 
                    
                    obj.remove();
                    gameObjects.splice(i, 1);

                    if (lives <= 0) {
                        endGame();
                    }
                }
            }
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);

            document.querySelectorAll('.falling-word-object').forEach(obj => obj.remove());
            gameObjects = [];

            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
